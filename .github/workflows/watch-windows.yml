# Windows build only. No Apple credentials, releases, startup jobs, or paid runners.
name: Windows Watch experimental build
on:
  workflow_dispatch:
  push:
    branches: [watch-2.4.1]
permissions:
  contents: read
concurrency:
  group: watch-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_VERSION: '1.98.1'
      BUN_VERSION: '1.4.2'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Visual C++ environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install pinned compiler and frontend tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          rustup override set $env:RUST_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
          npm install --global "bun@$env:BUN_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Bun installation failed' }
          # OpenSSL vendored builds require Perl and make on Windows.
          choco install strawberryperl make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Native build prerequisite installation failed' }
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Strawberry\c\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and build Windows x64 executable
        shell: pwsh
        run: ./scripts/Build-Watch-Windows.ps1
      - name: Upload executable, hashes, provenance and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iloader-2.4.1-watch-experimental-${{ github.sha }}
          path: out/watch-windows/
          if-no-files-found: error
          retention-days: 14
